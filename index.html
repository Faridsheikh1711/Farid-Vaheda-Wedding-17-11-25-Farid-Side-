<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1110">
<title>Farid & Vaheda — Wedding Album</title>
<style>
:root{--bg:#09100e;--bg2:#111b18;--gold:#d6b36a;--gold2:#f0d79b;--cream:#f7f1e5;--paper:#fffdf8;--muted:#b8b0a2;--green:#19382f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,'Times New Roman',serif;color:var(--cream);background:radial-gradient(circle at 50% 5%,#233c34 0,#101a17 35%,#070b0a 78%)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 45%,rgba(0,0,0,.48) 100%)}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 18px 58px;gap:12px;position:relative;z-index:1}
.top{width:min(1280px,96vw);display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 10px/1.2 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#ded6c8}
.brand span{color:var(--gold)}.actions{display:flex;gap:7px}
button{appearance:none;border:1px solid #d6b36a55;background:#0d1513dd;color:#f6eddf;border-radius:999px;padding:9px 13px;font:600 10px Arial,sans-serif;letter-spacing:.08em;cursor:pointer;transition:.2s}
button:hover{border-color:var(--gold);transform:translateY(-1px)}button.active{background:#284b40;border-color:#d6b36a99}
.viewer{width:min(1320px,96vw);height:min(78vh,760px);min-height:350px;display:flex;align-items:center;justify-content:center;perspective:2200px;position:relative}
.book{position:relative;width:min(1160px,94vw);height:min(680px,74vh);display:flex;align-items:stretch;justify-content:center;filter:drop-shadow(0 30px 38px rgba(0,0,0,.55))}
.page{position:relative;background:var(--paper);overflow:hidden;box-shadow:0 0 0 1px #d0c2a866,inset 0 0 38px rgba(61,42,20,.1);transform-style:preserve-3d}
.page img{display:block;width:100%;height:100%;object-fit:contain;background:#eee9df}
.left{border-radius:4px 0 0 4px}.right{border-radius:0 4px 4px 0;border-left:1px solid rgba(70,50,25,.2)}
.spread{width:100%;height:100%;display:flex;position:relative;overflow:hidden}
.spread .page{width:50%;height:100%}
.spread:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:20px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.25),rgba(255,255,255,.5),rgba(0,0,0,.22),transparent);pointer-events:none;z-index:5}
.single{width:min(820px,92vw);height:100%;border-radius:4px;box-shadow:0 0 0 1px #d0c2a866,inset 0 0 48px rgba(61,42,20,.12)}
.single:before,.page:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(105deg,rgba(255,255,255,.12),transparent 25%,transparent 75%,rgba(61,42,20,.09))}
.single .folio,.spread .folio{position:absolute;z-index:3;bottom:12px;right:14px;font:600 9px Arial,sans-serif;letter-spacing:.14em;color:#766c5f;background:rgba(255,255,255,.78);padding:6px 8px;border-radius:20px}
.welcome{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 42%,rgba(33,67,56,.55),rgba(5,9,8,.94) 70%);backdrop-filter:blur(2px)}
.welcomeCard{padding:46px 50px;border:1px solid #d6b36a66;border-radius:4px;background:linear-gradient(145deg,rgba(13,23,20,.88),rgba(7,12,11,.95));box-shadow:0 24px 80px #0008;max-width:700px}
.kicker{font:600 10px Arial,sans-serif;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}.welcome h1{margin:0;font-size:clamp(44px,7vw,88px);font-weight:500;line-height:.95}.welcome h1 em{color:var(--gold);font-style:italic}.welcome p{margin:18px 0 28px;font:500 11px Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#d1c8ba}
.open{padding:13px 24px;background:var(--green);border-color:#d6b36a99;letter-spacing:.18em}
.bottom{width:min(1160px,94vw);display:flex;align-items:center;gap:12px}.counter{min-width:92px;text-align:center;font:600 10px Arial,sans-serif;letter-spacing:.16em;color:#d8cdbb}.track{height:2px;flex:1;background:#ffffff16}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7d9f8e,var(--gold));transition:.4s}.hint{text-align:center;font:9px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#918b80;margin-top:-3px}
.final{display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,#f9f4e9,#e8dfce)}.finalInner{padding:40px;color:#1c2823}.final .small{font:600 10px Arial,sans-serif;letter-spacing:.3em;color:#8a6b35}.final h2{font-size:clamp(34px,5vw,64px);font-weight:500;margin:14px 0}.final p{font:500 11px/1.8 Arial,sans-serif;letter-spacing:.12em;color:#5d5a52}.final .maker{margin-top:24px;padding-top:20px;border-top:1px solid #a68c5b66;font:600 11px/1.7 Arial,sans-serif;letter-spacing:.08em}
.turnNext{animation:turnNext .72s cubic-bezier(.2,.72,.18,1)}@keyframes turnNext{0%{transform:rotateY(0);transform-origin:left;filter:brightness(1)}45%{transform:rotateY(-88deg);filter:brightness(.78)}100%{transform:rotateY(0);filter:brightness(1)}}
.turnPrev{animation:turnPrev .72s cubic-bezier(.2,.72,.18,1)}@keyframes turnPrev{0%{transform:rotateY(0);transform-origin:right}45%{transform:rotateY(88deg);filter:brightness(.78)}100%{transform:rotateY(0);filter:brightness(1)}}
@media(max-width:760px){.app{padding:9px 8px 48px;gap:7px}.top{font-size:8px}.top .brand{max-width:52%;line-height:1.4}.actions button{padding:7px 9px;font-size:8px}.actions #auto{display:none}.viewer{height:calc(100vh - 145px);min-height:310px;width:100%}.book{width:94vw;height:100%;max-height:calc(100vh - 170px)}.spread .page{width:100%}.spread .right,.spread:after{display:none}.single{width:94vw}.bottom{width:94vw}.hint{font-size:8px}.welcomeCard{padding:36px 22px;width:88vw}.welcome h1{font-size:clamp(42px,13vw,64px)}.welcome p{font-size:9px;line-height:1.7;letter-spacing:.18em}}
@media(min-width:761px) and (max-height:620px){.book{height:72vh}.viewer{height:75vh}.top{font-size:9px}.bottom{margin-top:-2px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">FARID <span>&</span> VAHEDA · WEDDING <span>17.11.2025</span></div><div class="actions"><button id="music">Play Song</button><button id="auto">Auto Turn</button><button id="full">Fullscreen</button></div></header>
<main class="viewer" id="viewer">
  <div class="welcome" id="welcome"><div class="welcomeCard"><div class="kicker">A Wedding Story</div><h1>Farid <em>&</em> Vaheda</h1><p>17 November 2025 · Memories from Farid's Side</p><button class="open" id="open">Open Album</button></div></div>
  <div class="book" id="book"></div>
</main>
<div class="bottom"><button id="prev">‹</button><div class="counter" id="counter">01 / 36</div><div class="track"><i id="progress"></i></div><button id="next">›</button></div>
<div class="hint">Swipe on mobile · Use ← → on desktop · Tap page edges to turn</div>
<audio id="song" preload="metadata" loop src="song.mp3"></audio>
<script>
const PAGES=Array.from({length:36},(_,i)=>`page-${String(i+1).padStart(2,'0')}.jpg`);
const VERSION='v3';
// EXACT LAYOUT: only 01, 02 and 35 are standalone photo pages. Pages 03–34 are 16 two-page spreads. Page 36 is the final thank-you page.
const UNITS=[[1],[2]];
for(let n=3;n<=34;n+=2) UNITS.push([n,n+1]);
UNITS.push([35],[36]);
let idx=0,started=false,timer=null,sx=0;
const book=document.getElementById('book'),welcome=document.getElementById('welcome'),counter=document.getElementById('counter'),progress=document.getElementById('progress'),song=document.getElementById('song'),music=document.getElementById('music');
function makePage(n,side){const p=document.createElement('div');p.className='page '+side;const im=document.createElement('img');im.src=PAGES[n-1]+'?'+VERSION;im.alt=`Farid & Vaheda — page ${String(n).padStart(2,'0')}`;im.loading='eager';im.onerror=()=>{im.alt='Photo unavailable';};p.appendChild(im);const f=document.createElement('div');f.className='folio';f.textContent=String(n).padStart(2,'0');p.appendChild(f);return p;}
function render(dir=0){const u=UNITS[idx];book.innerHTML='';book.className='book '+(u.length===1?'single':'');if(u.length===1){if(u[0]===36){const p=document.createElement('div');p.className='page single final';p.innerHTML='<div class="finalInner"><div class="small">FARID & VAHEDA · 17 NOVEMBER 2025</div><h2>Thank You</h2><p>For being part of our beautiful journey<br>and for making our memories even more special.</p><div class="maker">Made by Farid Sheikh<br>Mob. +91 9723148848</div></div>';book.appendChild(p)}else book.appendChild(makePage(u[0],'single'));}
else{const s=document.createElement('div');s.className='spread';s.appendChild(makePage(u[0],'left'));s.appendChild(makePage(u[1],'right'));book.appendChild(s)}
counter.textContent=u.length===1?String(u[0]).padStart(2,'0')+' / 36':String(u[0]).padStart(2,'0')+'–'+String(u[1]).padStart(2,'0')+' / 36';progress.style.width=((idx+1)/UNITS.length*100)+'%';if(dir){book.classList.remove('turnNext','turnPrev');void book.offsetWidth;book.classList.add(dir>0?'turnNext':'turnPrev');}}
function paperSound(){if(!song.paused)return;try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type='triangle';o.frequency.setValueAtTime(145,a.currentTime);o.frequency.exponentialRampToValueAtTime(55,a.currentTime+.18);f.type='lowpass';f.frequency.value=1400;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.045,a.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.2);o.connect(f);f.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.21);setTimeout(()=>a.close?.(),500);}catch(e){}}
function go(dir){if(!started)return;const ni=Math.max(0,Math.min(UNITS.length-1,idx+dir));if(ni===idx)return;idx=ni;render(dir);paperSound();}
function start(){started=true;welcome.style.display='none';render();song.play().then(()=>{music.textContent='Pause Song';music.classList.add('active')}).catch(()=>{})}
document.getElementById('open').onclick=start;document.getElementById('next').onclick=()=>go(1);document.getElementById('prev').onclick=()=>go(-1);
music.onclick=()=>{if(song.paused){song.play();music.textContent='Pause Song';music.classList.add('active')}else{song.pause();music.textContent='Play Song';music.classList.remove('active')}};
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
document.getElementById('auto').onclick=()=>{if(timer){clearInterval(timer);timer=null;document.getElementById('auto').textContent='Auto Turn'}else{timer=setInterval(()=>{if(idx<UNITS.length-1)go(1);else{clearInterval(timer);timer=null}},6000);document.getElementById('auto').textContent='Stop Auto'}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key===' '&&started){e.preventDefault();music.click()}});
book.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)go(dx<0?1:-1)});
book.addEventListener('click',e=>{if(!started)return;const r=book.getBoundingClientRect();go(e.clientX>r.left+r.width/2?1:-1)});
render();
</script>
</body></html>
