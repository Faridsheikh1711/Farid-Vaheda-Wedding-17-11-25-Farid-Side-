<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070807">
<title>Farid & Vaheda — Wedding Album</title>
<style>
:root{--bg:#070807;--gold:#d8b56d;--paper:#f7f3ea;--ink:#17130e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 10%,#233129,#080a09 55%,#030403);color:#f6efe4;font-family:Georgia,serif}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 12px 52px;gap:10px}
.top{width:min(1280px,96vw);display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 10px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#ddd3c3}.top b{color:var(--gold)}
.controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}button{border:1px solid #d8b56d55;background:#101411;color:#f5eee4;border-radius:999px;padding:8px 11px;font:600 9px Arial,sans-serif;cursor:pointer}button.active{background:#2a3a30;border-color:#d8b56d99}
.viewer{width:min(1320px,98vw);height:min(82vh,790px);display:flex;align-items:center;justify-content:center;perspective:2400px}
.stage{position:relative;display:flex;align-items:stretch;justify-content:center;filter:drop-shadow(0 28px 35px rgba(0,0,0,.65));transform-style:preserve-3d;transition:width .35s ease,height .35s ease}
.spread{position:relative;display:flex;width:100%;height:100%;background:var(--paper);border-radius:5px;overflow:hidden;transform-style:preserve-3d;box-shadow:0 0 0 1px #5a442555,0 18px 38px #0009}
.half{position:relative;width:50%;height:100%;overflow:hidden;background:#eee9df}.half.left{border-radius:5px 0 0 5px}.half.right{border-radius:0 5px 5px 0}
.half img{position:absolute;top:0;height:100%;width:200%;max-width:none;object-fit:fill;display:block}.half.left img{left:0}.half.right img{left:-100%}
.half:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.09),transparent 20%,transparent 80%,rgba(0,0,0,.07))}
.spine{position:absolute;z-index:5;left:50%;top:0;bottom:0;width:22px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.18),rgba(255,255,255,.25),rgba(0,0,0,.2),transparent);mix-blend-mode:multiply}.spine:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#4d382544}
.single{position:relative;background:var(--paper);overflow:hidden;border-radius:5px;box-shadow:0 0 0 1px #5a442555,0 18px 38px #0009}.single img{width:100%;height:100%;object-fit:contain;display:block;background:#eee9df}.single:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 28px #3b291516}
.single.final{display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,#fbf7ed,#e7ddc9);color:#17221c}.finalInner{padding:35px}.finalInner .small{font:600 9px Arial,sans-serif;letter-spacing:.28em;color:#876a35}.finalInner h1{font-size:clamp(34px,5vw,64px);font-weight:500;margin:12px 0}.finalInner p{font:500 11px Arial,sans-serif;letter-spacing:.14em;line-height:1.8}.pageNo{position:absolute;right:10px;bottom:9px;z-index:10;background:#111b16dd;color:#fff;padding:5px 8px;border-radius:99px;font:700 8px Arial,sans-serif;letter-spacing:.1em}
.turn{animation:turn .72s cubic-bezier(.22,.72,.25,1)}@keyframes turn{0%{transform:rotateY(0);filter:brightness(1)}45%{transform:rotateY(-78deg);filter:brightness(.72)}100%{transform:rotateY(0);filter:brightness(1)}}
.bottom{position:fixed;bottom:9px;left:50%;transform:translateX(-50%);width:min(850px,92vw);display:flex;align-items:center;justify-content:center;gap:12px;z-index:20}.nav{display:flex;gap:8px}.nav button{font-size:18px;padding:6px 13px;line-height:1}.counter{font:600 9px Arial,sans-serif;letter-spacing:.15em;color:#cfc4b2}
.hint{position:fixed;bottom:9px;left:14px;font:9px Arial,sans-serif;color:#a9a093;opacity:.8}
@media(max-width:700px){
 body{background:#070807}.app{padding:8px 7px 58px}.top{font-size:8px;width:94vw}.top .controls button:nth-child(2),.top .controls button:nth-child(3){display:none}.viewer{height:calc(100vh - 105px);width:100%;align-items:center}.stage{width:94vw!important;height:auto!important}.spread{width:100%;height:auto;display:block;overflow:hidden}.half{display:none}.spread.mobileFull{display:block}.spread.mobileFull .half:first-child{display:block;width:100%;height:auto;aspect-ratio:auto}.spread.mobileFull .half:first-child img{position:relative;left:0!important;top:0;width:100%;height:auto;object-fit:contain}.spine{display:none}.single{width:94vw!important;height:auto!important;max-height:calc(100vh - 150px);aspect-ratio:auto}.single img{width:100%;height:auto;max-height:calc(100vh - 150px);object-fit:contain}.pageNo{bottom:7px;right:7px}.bottom{bottom:7px}.hint{display:none}
}
</style></head>
<body>
<div class="app">
<div class="top"><div>FARID <b>&</b> VAHEDA · WEDDING · 17.11.2025</div><div class="controls"><button id="music">♫ Music</button><button id="auto">Auto Turn</button><button id="fs">Fullscreen</button></div></div>
<div class="viewer"><div id="stage" class="stage"></div></div>
</div>
<div class="bottom"><div class="nav"><button id="prev">‹</button><button id="next">›</button></div><div id="counter" class="counter"></div></div><div class="hint">Swipe / use arrows</div>
<audio id="audio" src="song.mp3" preload="auto" loop></audio>
<script>
const single=[1,2,35], total=36; let current=1, autoTimer=null;
const stage=document.getElementById('stage'), counter=document.getElementById('counter'), audio=document.getElementById('audio');
const pad=n=>String(n).padStart(2,'0');
function img(n){return `page-${pad(n)}.jpg`}
function setStageSize(n){
 const w=Math.min(window.innerWidth*.92,1200), maxH=Math.min(window.innerHeight*.72,690);
 if(single.includes(n)||n===36){stage.style.width=Math.min(w*.62,760)+'px';stage.style.height=maxH+'px';}
 else {let r=1.45; const probe=new Image(); probe.onload=()=>{const rr=probe.naturalWidth/probe.naturalHeight;let ww=Math.min(w,1200),hh=ww/rr;if(hh>maxH){hh=maxH;ww=hh*rr}stage.style.width=ww+'px';stage.style.height=hh+'px'};probe.src=img(n);}
}
function render(n,animate=true){
 current=Math.max(1,Math.min(total,n)); setStageSize(current); stage.innerHTML='';
 if(current===36){stage.innerHTML=`<div class="single final"><div class="finalInner"><div class="small">WITH LOVE & GRATITUDE</div><h1>Thank You</h1><p>FOR BEING PART OF OUR BEAUTIFUL JOURNEY</p><p>Made by Farid Sheikh<br>Mob. +91 9723148848</p><p>FARID & VAHEDA · 17 · 11 · 2025</p></div></div>`}
 else if(single.includes(current)) stage.innerHTML=`<div class="single"><img src="${img(current)}" alt="Wedding page ${current}" loading="eager"><div class="pageNo">${pad(current)}</div></div>`;
 else stage.innerHTML=`<div class="spread mobileFull"><div class="half left"><img src="${img(current)}" alt="Wedding page ${current}" loading="eager"></div><div class="half right"><img src="${img(current)}" alt="Wedding page ${current}" loading="eager"></div><div class="spine"></div><div class="pageNo">${pad(current)}</div></div>`;
 counter.textContent=`${pad(current)} / ${pad(total)}`;
 if(animate){stage.classList.remove('turn');void stage.offsetWidth;stage.classList.add('turn');}
}
function next(){if(current<total){render(current+1); if(!audio.paused)return; paperSound()}}
function prev(){if(current>1){render(current-1); if(!audio.paused)return; paperSound()}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;
document.getElementById('music').onclick=async()=>{if(audio.paused){try{await audio.play()}catch(e){};document.getElementById('music').classList.add('active')}else{audio.pause();document.getElementById('music').classList.remove('active')}};
document.getElementById('auto').onclick=()=>{const b=document.getElementById('auto');if(autoTimer){clearInterval(autoTimer);autoTimer=null;b.classList.remove('active')}else{autoTimer=setInterval(()=>{if(current>=total){clearInterval(autoTimer);autoTimer=null;b.classList.remove('active');return}next()},4200);b.classList.add('active')}};
document.getElementById('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)(dx<0?next:prev)()},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft'){e.preventDefault();prev()}});
window.addEventListener('resize',()=>setStageSize(current));
function paperSound(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='triangle';o.frequency.setValueAtTime(120,c.currentTime);o.frequency.exponentialRampToValueAtTime(48,c.currentTime+.16);f.type='lowpass';f.frequency.value=800;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.045,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.18);o.connect(f);f.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.19);setTimeout(()=>c.close(),350)}
render(1,false);
</script></body></html>
