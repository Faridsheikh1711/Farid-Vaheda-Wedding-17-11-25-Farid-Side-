<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0a">
<title>Farid & Vaheda — Wedding Album</title>
<style>
:root{--bg:#070a09;--panel:#111512;--gold:#d5b16a;--gold2:#f2d79a;--ink:#17130e;--paper:#f9f6ee;--muted:#aaa294;--pageW:min(560px,45vw);--pageH:min(690px,72vh)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Georgia,'Times New Roman',serif;color:#f5eee2;background:radial-gradient(circle at 50% 15%,#27352e 0,#101612 34%,#050706 82%)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 38%,rgba(0,0,0,.72) 100%);z-index:0}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 14px 46px;gap:10px;position:relative;z-index:1}.top{width:min(1260px,96vw);display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 10px/1.3 Arial,sans-serif;letter-spacing:.18em;color:#ded5c5;text-transform:uppercase}.brand span{color:var(--gold)}.actions{display:flex;gap:7px}button{appearance:none;border:1px solid #d5b16a4d;background:#101512e8;color:#f7f0e5;border-radius:999px;padding:8px 12px;font:600 9px Arial,sans-serif;letter-spacing:.08em;cursor:pointer;transition:.22s ease}button:hover{border-color:var(--gold);transform:translateY(-1px)}button.active{background:#294237;border-color:#d5b16ab0}
.viewer{width:min(1320px,97vw);height:min(78vh,760px);min-height:350px;display:flex;align-items:center;justify-content:center;perspective:2600px;position:relative}.book{position:relative;width:min(1160px,94vw);height:min(680px,74vh);display:flex;align-items:stretch;justify-content:center;filter:drop-shadow(0 34px 42px rgba(0,0,0,.62));transform-style:preserve-3d}
.spread{width:100%;height:100%;display:flex;position:relative;transform-style:preserve-3d}.page{position:relative;overflow:hidden;background:var(--paper);box-shadow:inset 0 0 35px rgba(60,39,15,.12),0 0 0 1px rgba(100,75,42,.2);transform-style:preserve-3d;backface-visibility:hidden}.spread>.page{width:50%;height:100%}.left{border-radius:5px 0 0 5px}.right{border-radius:0 5px 5px 0;border-left:1px solid rgba(62,43,22,.22)}.page img{display:block;width:100%;height:100%;object-fit:contain;background:#e9e4da}.page:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,.12),transparent 18%,transparent 78%,rgba(40,26,12,.08));z-index:3}.page:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.05),transparent 13%,transparent 87%,rgba(0,0,0,.1));z-index:2}.folio{position:absolute;z-index:5;bottom:10px;right:12px;font:600 8px Arial,sans-serif;letter-spacing:.14em;color:#70685c;background:rgba(255,253,247,.78);padding:5px 7px;border-radius:20px}.spine{position:absolute;left:50%;top:0;bottom:0;width:24px;transform:translateX(-50%);z-index:9;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.22),rgba(255,255,255,.34),rgba(0,0,0,.2),transparent);mix-blend-mode:multiply}.spine:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(50,34,17,.24)}
.single{width:min(760px,72vw);height:100%;border-radius:5px;position:relative}.single .page{width:100%;height:100%;border-radius:5px}.single.final{display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,#faf6ec,#e7decc)}.finalInner{padding:38px;color:#1e2a24}.final .small{font:600 9px Arial,sans-serif;letter-spacing:.3em;color:#876a35}.final h2{font-size:clamp(34px,5vw,64px);font-weight:500;margin:14px 0}.final p{font:500 11px/1.8 Arial,sans-serif;letter-spacing:.11em;color:#5c5951}.final .maker{margin-top:22px;padding-top:18px;border-top:1px solid #a68c5b66;font:600 10px/1.7 Arial,sans-serif;letter-spacing:.08em}
/* Realistic page-turn layer */
.turnLayer{position:absolute;inset:0;z-index:30;pointer-events:none;transform-style:preserve-3d}.turnPage{position:absolute;top:0;width:50%;height:100%;overflow:hidden;background:var(--paper);box-shadow:0 10px 32px rgba(0,0,0,.36);transform-style:preserve-3d;backface-visibility:hidden}.turnPage.leftTurn{left:0;transform-origin:right center}.turnPage.rightTurn{right:0;transform-origin:left center}.turnPage .face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:var(--paper)}.turnPage .face img{width:100%;height:100%;display:block;object-fit:contain;background:#e9e4da}.turnPage .back{transform:rotateY(180deg);background:linear-gradient(100deg,#efe9dc,#fbf8f0)}.turnPage .back:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 28%,rgba(255,255,255,.18));}.turnPage.rightTurn.next{animation:pageForward .92s cubic-bezier(.22,.7,.14,1) forwards}.turnPage.leftTurn.prev{animation:pageBackward .92s cubic-bezier(.22,.7,.14,1) forwards}@keyframes pageForward{0%{transform:rotateY(0deg);box-shadow:0 8px 24px rgba(0,0,0,.22)}18%{box-shadow:-16px 16px 34px rgba(0,0,0,.35)}52%{box-shadow:-30px 18px 42px rgba(0,0,0,.28)}100%{transform:rotateY(-180deg);box-shadow:0 0 0 rgba(0,0,0,0)}}@keyframes pageBackward{0%{transform:rotateY(0deg);box-shadow:0 8px 24px rgba(0,0,0,.22)}18%{box-shadow:16px 16px 34px rgba(0,0,0,.35)}52%{box-shadow:30px 18px 42px rgba(0,0,0,.28)}100%{transform:rotateY(180deg);box-shadow:0 0 0 rgba(0,0,0,0)}}
.welcome{position:absolute;z-index:50;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(43,70,58,.48),rgba(4,7,6,.96) 72%);backdrop-filter:blur(3px)}.welcomeCard{padding:46px 50px;border:1px solid #d5b16a66;border-radius:5px;background:linear-gradient(145deg,rgba(16,24,21,.9),rgba(5,9,8,.96));box-shadow:0 28px 90px #000a;max-width:700px}.kicker{font:600 9px Arial,sans-serif;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}.welcome h1{margin:0;font-size:clamp(44px,7vw,88px);font-weight:500;line-height:.95}.welcome h1 em{color:var(--gold);font-style:italic}.welcome p{margin:18px 0 28px;font:500 10px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#d1c8ba}.open{padding:13px 24px;background:#1d3d32;border-color:#d5b16a99;letter-spacing:.18em}
.bottom{width:min(1160px,94vw);display:flex;align-items:center;gap:12px}.counter{min-width:98px;text-align:center;font:600 9px Arial,sans-serif;letter-spacing:.15em;color:#d8cdbb}.track{height:2px;flex:1;background:#ffffff15}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#719382,var(--gold));transition:.5s}.hint{text-align:center;font:8px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#918b80;margin-top:-2px}
@media(max-width:760px){.app{padding:8px 7px 44px;gap:7px}.top{font-size:7px}.top .brand{max-width:52%;line-height:1.45}.actions button{padding:7px 9px;font-size:8px}.actions #auto{display:none}.viewer{height:calc(100vh - 138px);min-height:310px;width:100%}.book{width:94vw;height:100%;max-height:calc(100vh - 160px)}.spread>.page{width:100%}.spread>.right,.spine{display:none}.single{width:94vw}.turnPage{width:100%}.turnPage.rightTurn{right:0;left:0}.turnPage.leftTurn{left:0}.bottom{width:94vw}.hint{font-size:7px}.welcomeCard{padding:36px 22px;width:88vw}.welcome h1{font-size:clamp(42px,13vw,64px)}.welcome p{font-size:8px;line-height:1.7;letter-spacing:.17em}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">FARID <span>&</span> VAHEDA · WEDDING <span>17.11.2025</span></div><div class="actions"><button id="music">Play Song</button><button id="auto">Auto Turn</button><button id="full">Fullscreen</button></div></header>
<main class="viewer" id="viewer">
<div class="welcome" id="welcome"><div class="welcomeCard"><div class="kicker">A Wedding Story</div><h1>Farid <em>&</em> Vaheda</h1><p>17 November 2025 · Memories from Farid's Side</p><button class="open" id="open">Open Album</button></div></div>
<div class="book" id="book"></div>
</main>
<div class="bottom"><button id="prev">‹</button><div class="counter" id="counter">01 / 36</div><div class="track"><i id="progress"></i></div><button id="next">›</button></div>
<div class="hint">Swipe · Arrow keys · Tap the page edges</div>
<audio id="song" preload="metadata" loop src="song.mp3"></audio>
<script>
const PAGES=Array.from({length:36},(_,i)=>`page-${String(i+1).padStart(2,'0')}.jpg`);
const UNITS=[[1],[2]];for(let n=3;n<=34;n+=2)UNITS.push([n,n+1]);UNITS.push([35],[36]);
let idx=0,started=false,busy=false,timer=null,sx=0;
const book=document.getElementById('book'),welcome=document.getElementById('welcome'),counter=document.getElementById('counter'),progress=document.getElementById('progress'),song=document.getElementById('song'),music=document.getElementById('music');
function imgEl(n){const im=document.createElement('img');im.src=PAGES[n-1];im.alt=`Farid & Vaheda — page ${String(n).padStart(2,'0')}`;return im}
function makePhoto(n,side){const p=document.createElement('div');p.className='page '+side;p.appendChild(imgEl(n));const f=document.createElement('div');f.className='folio';f.textContent=String(n).padStart(2,'0');p.appendChild(f);return p}
function unitNode(u){if(u.length===1){if(u[0]===36){const p=document.createElement('div');p.className='single final';p.innerHTML='<div class="finalInner"><div class="small">FARID & VAHEDA · 17 NOVEMBER 2025</div><h2>Thank You</h2><p>For being part of our beautiful journey<br>and for making our memories even more special.</p><div class="maker">Made by Farid Sheikh<br>Mob. +91 9723148848</div></div>';return p}const s=document.createElement('div');s.className='single';s.appendChild(makePhoto(u[0],'single'));return s}
const s=document.createElement('div');s.className='spread';s.appendChild(makePhoto(u[0],'left'));s.appendChild(makePhoto(u[1],'right'));const spine=document.createElement('div');spine.className='spine';s.appendChild(spine);return s}
function render(){book.innerHTML='';const u=UNITS[idx];book.className='book '+(u.length===1?'single':'');book.appendChild(unitNode(u));counter.textContent=u.length===1?String(u[0]).padStart(2,'0')+' / 36':String(u[0]).padStart(2,'0')+'–'+String(u[1]).padStart(2,'0')+' / 36';progress.style.width=((idx+1)/UNITS.length*100)+'%'}
function makeTurner(side,from,to){const layer=document.createElement('div');layer.className='turnLayer';const t=document.createElement('div');t.className='turnPage '+(side==='next'?'rightTurn next':'leftTurn prev');const front=document.createElement('div');front.className='face front';front.appendChild(imgEl(from));const back=document.createElement('div');back.className='face back';back.appendChild(imgEl(to));t.append(front,back);layer.appendChild(t);book.appendChild(layer);return layer}
function paperSound(){if(!song.paused)return;try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),buf=a.createBuffer(1,a.sampleRate*.16,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++){const env=Math.pow(1-i/d.length,2.5);d[i]=(Math.random()*2-1)*env*(.32+.68*Math.random())}const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=buf;f.type='bandpass';f.frequency.value=1700;f.Q.value=.55;g.gain.value=.12;src.connect(f);f.connect(g);g.connect(a.destination);src.start();setTimeout(()=>a.close?.(),500)}catch(e){}}
function go(dir){if(!started||busy)return;const ni=Math.max(0,Math.min(UNITS.length-1,idx+dir));if(ni===idx)return;busy=true;const old=UNITS[idx],next=UNITS[ni];
// Put the destination spread underneath immediately, then use a physical page layer to reveal it.
idx=ni;render();
if(old.length===2&&next.length===2){const from=dir>0?old[1]:old[0],to=dir>0?next[0]:next[1];const layer=makeTurner(dir>0?'next':'prev',from,to);setTimeout(()=>layer.remove(),940)}else{const from=old[0],to=next[0];const layer=makeTurner(dir>0?'next':'prev',from,to);setTimeout(()=>layer.remove(),940)}
paperSound();setTimeout(()=>busy=false,960)}
function start(){started=true;welcome.style.display='none';render();song.play().then(()=>{music.textContent='Pause Song';music.classList.add('active')}).catch(()=>{})}
document.getElementById('open').onclick=start;document.getElementById('next').onclick=()=>go(1);document.getElementById('prev').onclick=()=>go(-1);
music.onclick=()=>{if(song.paused){song.play();music.textContent='Pause Song';music.classList.add('active')}else{song.pause();music.textContent='Play Song';music.classList.remove('active')}};
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
document.getElementById('auto').onclick=()=>{if(timer){clearInterval(timer);timer=null;document.getElementById('auto').textContent='Auto Turn'}else{timer=setInterval(()=>{if(idx<UNITS.length-1)go(1);else{clearInterval(timer);timer=null}},6000);document.getElementById('auto').textContent='Stop Auto'}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key===' '&&started){e.preventDefault();music.click()}});
book.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)go(dx<0?1:-1)});
book.addEventListener('click',e=>{if(!started||busy)return;const r=book.getBoundingClientRect();go(e.clientX>r.left+r.width/2?1:-1)});
render();
</script>
</body></html>
