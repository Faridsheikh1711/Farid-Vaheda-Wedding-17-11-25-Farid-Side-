<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090807">
<title>Farid & Vaheda — Wedding Album</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap');
:root{--bg:#080706;--gold:#d1ad68;--cream:#f4eee4;--muted:#aaa298}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:Inter,Arial,sans-serif}body{overflow-x:hidden}
button{font:inherit}
#cover{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 45%,rgba(209,173,104,.18),transparent 30%),linear-gradient(135deg,#050504,#19130d 55%,#060504);display:grid;place-items:center;transition:opacity .9s,visibility .9s}.hide{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.cover{text-align:center;padding:24px;animation:rise 1.1s ease both}.crest{font-family:'Cormorant Garamond',serif;color:var(--gold);letter-spacing:.45em;font-size:18px;margin-left:.45em}.line{width:90px;height:1px;background:var(--gold);opacity:.7;margin:20px auto}.kicker{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:#c7c0b5}.names{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(60px,12vw,128px);font-weight:300;line-height:.78;margin:25px 0 20px}.names em{color:var(--gold);font-style:normal}.date{font-size:11px;letter-spacing:.35em;color:#aaa298}.open{margin-top:34px;padding:14px 30px;background:transparent;border:1px solid rgba(209,173,104,.8);color:#fff;letter-spacing:.22em;text-transform:uppercase;font-size:10px;cursor:pointer}.open:hover{background:var(--gold);color:#111}.note{margin-top:12px;font-size:9px;color:#827a70}@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
header{height:64px;border-bottom:1px solid rgba(209,173,104,.16);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.logo{font:400 22px 'Cormorant Garamond',serif;letter-spacing:.12em}.logo b{color:var(--gold);font-weight:400}.tools{display:flex;gap:8px}.tool{width:38px;height:38px;border-radius:50%;background:#ffffff08;border:1px solid rgba(255,255,255,.16);color:#eee;cursor:pointer}
.album{width:min(1180px,94vw);margin:auto;padding:22px 0 35px}.book-wrap{display:flex;justify-content:center;align-items:center;perspective:2400px}.book{position:relative;width:min(1060px,100%);aspect-ratio:1.72/1;max-height:74vh;transform-style:preserve-3d;filter:drop-shadow(0 28px 40px rgba(0,0,0,.58))}.surface{position:absolute;inset:0;overflow:hidden;background:#151310;border:1px solid rgba(209,173,104,.32)}.surface img{width:100%;height:100%;object-fit:contain;display:block;background:#151310}.surface:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.24),transparent 17%,transparent 83%,rgba(0,0,0,.2))}#left{clip-path:inset(0 50% 0 0)}#right{clip-path:inset(0 0 0 50%)}.spine{position:absolute;left:50%;top:0;bottom:0;width:12px;transform:translateX(-50%);z-index:25;background:linear-gradient(90deg,#0008,#fff2 45%,#0008);pointer-events:none}.sheet{position:absolute;left:50%;top:0;width:50%;height:100%;z-index:30;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.72,.18,1)}.sheet.turn{transform:rotateY(-180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;border:1px solid rgba(209,173,104,.25);background:#151310}.face img{width:200%;height:100%;object-fit:contain;background:#151310}.front img{transform:translateX(-50%)}.back{transform:rotateY(180deg)}.back img{transform:none}.face:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0004,transparent 32%,#0002)}
.final .spine,.final .sheet{display:none}.final #left,.final #right{clip-path:none}.final #left{width:100%}.final #right{display:none}.final .surface img{object-fit:cover}
.credit{position:absolute;right:18px;bottom:16px;z-index:60;background:rgba(10,8,6,.78);border:1px solid rgba(209,173,104,.62);padding:7px 10px;color:#fff;font-size:10px;line-height:1.55;text-align:right;text-shadow:0 1px 3px #000;letter-spacing:.06em}.credit b{color:#f1d58e}
.label{text-align:center;margin-top:14px;color:#999187;font-size:10px;letter-spacing:.28em}.controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:15px}.arrow{width:48px;height:48px;border-radius:50%;border:1px solid rgba(209,173,104,.55);background:transparent;color:#eee;font-size:26px;cursor:pointer}.arrow:disabled{opacity:.2}.track{width:min(600px,52vw);height:2px;background:#fff1b}.track i{display:block;height:100%;background:var(--gold);width:3%;transition:width .5s}.sub{display:flex;justify-content:center;gap:20px;margin-top:10px;flex-wrap:wrap}.sub button{background:none;border:0;color:#9f978c;font-size:9px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:7px}.sub button:hover{color:var(--gold)}.footer{text-align:center;color:#716b63;font-size:9px;letter-spacing:.2em;text-transform:uppercase;padding:5px 20px 28px}.footer span{color:var(--gold);font-size:14px}
@media(max-width:700px){header{height:57px;padding:0 13px}.logo{font-size:19px}.album{width:94vw;padding-top:14px}.book{aspect-ratio:4/3;max-height:none}.spine{display:none}#left{clip-path:none;width:100%}#right{display:none}.sheet{display:none}.surface:after{background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 25%,transparent 75%,rgba(0,0,0,.18))}.credit{font-size:9px;right:10px;bottom:10px}.label{font-size:8px;letter-spacing:.2em}.controls{gap:7px}.arrow{width:44px;height:44px}.track{width:45vw}.names{font-size:clamp(58px,19vw,105px)}}
</style>
</head>
<body>
<section id="cover"><div class="cover"><div class="crest">F · V</div><div class="line"></div><div class="kicker">The Wedding Album</div><div class="names">Farid <em>&amp;</em> Vaheda</div><div class="date">17 · 11 · 2025</div><button class="open" id="open">Open Wedding Album</button><div class="note">For the best view, keep Auto Rotate ON.</div></div></section>
<header><div class="logo">FARID <b>&amp;</b> VAHEDA</div><div class="tools"><button class="tool" id="music">♪</button><button class="tool" id="full">⛶</button></div></header>
<main class="album"><div class="book-wrap"><div class="book" id="book"><div class="surface" id="left"><img id="leftImg" src="pages/page-01.jpg"></div><div class="surface" id="right"><img id="rightImg" src="pages/page-02.jpg"><div class="credit">Made by <b>Farid Sheikh</b><br>Mob. <b>+91 9723148848</b></div></div><div class="spine"></div><div class="sheet" id="sheet"><div class="face front"><img id="frontImg" src="pages/page-01.jpg"></div><div class="face back"><img id="backImg" src="pages/page-02.jpg"></div></div></div></div><div class="label" id="label">01 — 02 / 36</div><div class="controls"><button class="arrow" id="prev">‹</button><div class="track"><i id="progress"></i></div><button class="arrow" id="next">›</button></div><div class="sub"><button id="play">Play Song</button><button id="auto">Auto Turn Pages</button></div></main>
<div class="footer">A lifetime of memories <span>♡</span> Farid &amp; Vaheda</div><audio id="audio" src="song.mp3" preload="auto" loop></audio>
<script>
const total=37;let n=1,busy=false,timer=null;const $=id=>document.getElementById(id);const book=$('book'),sheet=$('sheet'),left=$('leftImg'),right=$('rightImg'),front=$('frontImg'),back=$('backImg'),audio=$('audio'),credit=document.querySelector('.credit');
function finalPage(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><defs><radialGradient id="g"><stop stop-color="#302316"/><stop offset=".55" stop-color="#17110c"/><stop offset="1" stop-color="#060504"/></radialGradient></defs><rect width="1600" height="1000" fill="url(#g)"/><rect x="65" y="65" width="1470" height="870" rx="4" fill="none" stroke="#d1ad68" stroke-opacity=".5"/><text x="800" y="300" text-anchor="middle" fill="#d1ad68" font-family="Georgia" font-size="34" letter-spacing="10">WITH LOVE &amp; GRATITUDE</text><text x="800" y="475" text-anchor="middle" fill="#f4eee4" font-family="Georgia" font-size="76">Thank You</text><text x="800" y="550" text-anchor="middle" fill="#aaa298" font-family="Arial" font-size="24" letter-spacing="3">FOR BEING PART OF OUR BEAUTIFUL JOURNEY</text><text x="800" y="685" text-anchor="middle" fill="#d1ad68" font-family="Georgia" font-size="32">Made by Farid Sheikh</text><text x="800" y="735" text-anchor="middle" fill="#eee8dc" font-family="Arial" font-size="25">Mob. +91 9723148848</text><text x="800" y="855" text-anchor="middle" fill="#81796e" font-family="Arial" font-size="18" letter-spacing="4">FARID &amp; VAHEDA · 17 · 11 · 2025</text></svg>`)}
const FINAL=finalPage();function file(k){return k===37?FINAL:(k>=1&&k<=36?`pages/page-${String(k).padStart(2,'0')}.jpg`:'')}
function update(){const r=Math.min(37,n+1);$('label').textContent=n===37?'37 / 37':`${String(n).padStart(2,'0')} — ${String(r).padStart(2,'0')} / 37`;$('progress').style.width=(Math.min(n+1,37)/37*100)+'%';$('prev').disabled=n===1;$('next').disabled=n>=37}
function setPages(){book.classList.toggle('final',n===37);credit.style.display=n===37?'none':'block';left.src=file(n);right.src=n===37?FINAL:file(Math.min(36,n+1));front.src=file(n);back.src=file(Math.min(37,n+1));update()}
function hardPaperSound(){if(!audio.paused)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=hardPaperSound.c||(hardPaperSound.c=new AC());if(c.state==='suspended')c.resume();const now=c.currentTime;const master=c.createGain();master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.16,now+.012);master.gain.exponentialRampToValueAtTime(.0001,now+.48);master.connect(c.destination);for(let j=0;j<3;j++){const dur=.28+j*.07;const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,.55);const s=c.createBufferSource(),f=c.createBiquadFilter();s.buffer=b;f.type=j===0?'bandpass':'highpass';f.frequency.value=j===0?1450+j*500:700+j*700;f.Q.value=j===0?1.2:.7;s.connect(f);f.connect(master);s.start(now+j*.035);s.stop(now+dur+j*.035)}}
function turn(dir){if(busy||(dir>0&&n>=37)||(dir<0&&n<=1))return;busy=true;hardPaperSound();if(dir>0){const nn=n+2;back.src=file(nn<=37?nn:37);sheet.classList.add('turn');setTimeout(()=>{n=Math.min(37,n+2);sheet.classList.remove('turn');setPages();busy=false},900)}else{front.src=file(Math.max(1,n-2));sheet.style.transition='none';sheet.classList.add('turn');requestAnimationFrame(()=>requestAnimationFrame(()=>{sheet.classList.remove('turn');requestAnimationFrame(()=>sheet.style.transition='transform .9s cubic-bezier(.2,.72,.18,1)')}));setTimeout(()=>{n=Math.max(1,n-2);setPages();busy=false},900)}}
$('next').onclick=()=>turn(1);$('prev').onclick=()=>turn(-1);$('open').onclick=async()=>{ $('cover').classList.add('hide'); try{await audio.play();$('music').textContent='❚❚';$('play').textContent='Pause Song'}catch(e){}};$('music').onclick=async()=>{if(audio.paused){try{await audio.play();$('music').textContent='❚❚';$('play').textContent='Pause Song'}catch(e){}}else{audio.pause();$('music').textContent='♪';$('play').textContent='Play Song'}};$('play').onclick=()=>$('music').click();$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('auto').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('auto').textContent='Auto Turn Pages'}else{$('auto').textContent='Stop Auto Turn';timer=setInterval(()=>{if(n<37)turn(1);else{clearInterval(timer);timer=null;$('auto').textContent='Auto Turn Pages'}},5200)}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});let sx=0;book.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)turn(dx<0?1:-1)},{passive:true});setPages();
</script></body></html>
