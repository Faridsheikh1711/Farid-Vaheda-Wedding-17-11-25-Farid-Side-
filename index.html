<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080706">
<title>Farid & Vaheda — Wedding Album</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#080706;color:#eee;font-family:Arial,Helvetica,sans-serif}
button{font:inherit}
#intro{position:fixed;inset:0;z-index:99;display:grid;place-items:center;text-align:center;
background:radial-gradient(circle at 50% 35%,#302516 0,#100d0a 38%,#050504 100%);
transition:.8s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.introbox{padding:28px}
.mark{width:92px;height:92px;border:1px solid #caa86b;border-radius:50%;display:grid;place-items:center;
margin:0 auto 25px;color:#ead8ae;font:22px Georgia,serif}
.kicker{color:#caa86b;font-size:10px;letter-spacing:5px;text-transform:uppercase;margin-bottom:18px}
h1{font:400 clamp(44px,8vw,82px)/.95 Georgia,serif;margin:0}
.date{color:#aaa097;letter-spacing:5px;font-size:11px;margin:24px 0 32px}
.enter{background:transparent;color:#ead8ae;border:1px solid #caa86b;padding:14px 25px;
letter-spacing:3px;text-transform:uppercase;font-size:10px;cursor:pointer}
.enter:hover{background:#caa86b;color:#080706}
#app{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;transition:.7s}
#app.show{opacity:1}
header{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;
background:rgba(8,7,6,.8);backdrop-filter:blur(15px);border-bottom:1px solid #29231c;z-index:20}
.brand{font:11px Georgia,serif;letter-spacing:2px;color:#e7d7b7}
.tools{display:flex;gap:8px}.tool{width:38px;height:38px;border-radius:50%;border:1px solid #59472e;
background:#100e0b;color:#e8d6b0;cursor:pointer}
.stage{position:relative;flex:1;display:grid;place-items:center;padding:16px 16px 70px;
perspective:1800px;background:radial-gradient(circle at 50% 45%,#1b1610 0,#080706 58%)}
.book{position:relative;width:min(1160px,94vw);height:min(78vh,760px);transform-style:preserve-3d;
filter:drop-shadow(0 35px 50px rgba(0,0,0,.65))}
.page{position:absolute;inset:0;background:#f2eee5;border:1px solid #bba984;border-radius:7px;
overflow:hidden;transform-style:preserve-3d}
.photo{width:100%;height:100%;display:block;object-fit:contain;background:#eee9df}
.sheet{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
transition:transform 1s cubic-bezier(.2,.75,.15,1);z-index:10}
.sheet.flip{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;transform-style:preserve-3d}
.back{transform:rotateY(180deg)}
.desktopFace{display:grid;grid-template-columns:1fr 1fr;gap:0}
.desktopFace .page:first-child{border-radius:7px 0 0 7px;border-right:1px solid #aaa08d}
.desktopFace .page:last-child{border-radius:0 7px 7px 0;border-left:1px solid #aaa08d}
.mobileFace{display:none}
.num{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);color:#746b5d;
font:10px Georgia,serif;letter-spacing:2px;background:rgba(242,238,229,.72);padding:3px 8px}
.cover{position:absolute;inset:0;z-index:50;border:1px solid #caa86b;border-radius:7px;
background:radial-gradient(circle at 50% 40%,#332719,#0d0b09 55%,#050504);
display:grid;place-items:center;text-align:center;transition:.8s}
.cover.hide{opacity:0;transform:scale(.985);pointer-events:none}
.cover:before{content:"";position:absolute;inset:17px;border:1px solid #725b38}
.cover h2{font:400 clamp(38px,6vw,72px)/.95 Georgia,serif;margin:0}
.gold{color:#caa86b}.sub{margin-top:20px;color:#aaa097;letter-spacing:4px;font-size:10px}
.controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:30;
display:flex;align-items:center;gap:12px;padding:7px 10px;border:1px solid #33291d;
background:rgba(10,9,8,.82);border-radius:999px;backdrop-filter:blur(14px)}
.nav{width:39px;height:39px;border-radius:50%;border:1px solid #665238;background:transparent;
color:#ead8ae;font-size:23px;cursor:pointer}
.count{min-width:82px;text-align:center;color:#aaa097;font:11px monospace}
.progress{position:absolute;bottom:0;left:0;right:0;height:2px;background:#211b14;z-index:40}
.progress i{display:block;height:100%;width:0;background:#caa86b;transition:.4s}
@media(max-width:700px){
header{height:56px;padding:0 12px}.brand{font-size:9px;letter-spacing:1.2px}
.stage{padding:10px 10px 66px}.book{width:94vw;height:78vh}
.desktopFace{display:none}.mobileFace{display:block}
.cover:before{inset:10px}.controls{bottom:8px}
}
</style>
</head>
<body>

<section id="intro">
  <div class="introbox">
    <div class="mark">F · V</div>
    <div class="kicker">Wedding Album · Farid's Side</div>
    <h1>Farid <span class="gold">&amp;</span> Vaheda</h1>
    <div class="date">17 · 11 · 2025</div>
    <button class="enter" id="enter">Enter Our Story</button>
  </div>
</section>

<main id="app">
<header>
  <div class="brand">F · V &nbsp; | &nbsp; FARID &amp; VAHEDA · 17.11.2025</div>
  <div class="tools">
    <button class="tool" id="music" title="Music">♫</button>
    <button class="tool" id="full" title="Fullscreen">⛶</button>
  </div>
</header>

<section class="stage" id="stage">
  <div class="book" id="book">
    <div class="cover" id="cover">
      <div>
        <div class="mark">F · V</div>
        <div class="kicker">The Wedding Album</div>
        <h2>Farid <span class="gold">&amp;</span> Vaheda</h2>
        <div class="sub">17 · 11 · 2025</div>
      </div>
    </div>
    <div id="sheets"></div>
  </div>
  <div class="controls">
    <button class="nav" id="prev">‹</button>
    <div class="count" id="count">01 / 36</div>
    <button class="nav" id="next">›</button>
  </div>
  <div class="progress"><i id="bar"></i></div>
</section>
</main>

<!-- Your GitHub screenshot shows the song is named song.mp3, so this path is intentional. -->
<audio id="audio" src="song.mp3" preload="auto" loop></audio>

<script>
const TOTAL=36;
const sheets=document.getElementById('sheets');
const count=document.getElementById('count');
const bar=document.getElementById('bar');
const audio=document.getElementById('audio');
const musicBtn=document.getElementById('music');
let current=0;

function img(n){
  const p=String(n).padStart(2,'0');
  return 'page-'+p+'.jpg';
}
function page(n){
  if(n>=TOTAL) return '<div class="page"></div>';
  return '<div class="page"><img class="photo" src="'+img(n+1)+'" alt="Wedding photo '+(n+1)+'" loading="lazy"><div class="num">'+String(n+1).padStart(2,'0')+'</div></div>';
}
function build(){
  sheets.innerHTML='';
  const mobile=matchMedia('(max-width:700px)').matches;
  if(mobile){
    for(let i=0;i<TOTAL;i++){
      sheets.insertAdjacentHTML('beforeend',
        '<div class="sheet"><div class="face mobileFace">'+page(i)+'</div>'+
        '<div class="face back mobileFace">'+page(i+1)+'</div></div>');
    }
  }else{
    for(let i=0;i<TOTAL;i+=2){
      sheets.insertAdjacentHTML('beforeend',
        '<div class="sheet"><div class="face desktopFace">'+page(i)+page(i+1)+'</div>'+
        '<div class="face back desktopFace">'+page(i+2)+page(i+3)+'</div></div>');
    }
  }
}
function go(n){
  current=Math.max(0,Math.min(TOTAL-1,n));
  const mobile=matchMedia('(max-width:700px)').matches;
  [...document.querySelectorAll('.sheet')].forEach((s,i)=>{
    const flip=mobile ? i<current : i<Math.floor(current/2);
    s.classList.toggle('flip',flip);
  });
  count.textContent=String(current+1).padStart(2,'0')+' / '+TOTAL;
  bar.style.width=((current+1)/TOTAL*100)+'%';
}
document.getElementById('enter').onclick=()=>{
  document.getElementById('intro').classList.add('hide');
  document.getElementById('app').classList.add('show');
  document.getElementById('cover').classList.add('hide');
  audio.play().then(()=>musicBtn.textContent='Ⅱ').catch(()=>{});
};
document.getElementById('next').onclick=()=>go(current+(matchMedia('(max-width:700px)').matches?1:2));
document.getElementById('prev').onclick=()=>go(current-(matchMedia('(max-width:700px)').matches?1:2));
musicBtn.onclick=()=>{
  if(audio.paused){audio.play().then(()=>musicBtn.textContent='Ⅱ').catch(()=>{})}
  else{audio.pause();musicBtn.textContent='♫'}
};
document.getElementById('full').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};
document.onkeydown=e=>{
  if(e.key==='ArrowRight') document.getElementById('next').click();
  if(e.key==='ArrowLeft') document.getElementById('prev').click();
  if(e.key===' ') {e.preventDefault();musicBtn.click()}
};
let sx=0;
document.getElementById('stage').ontouchstart=e=>sx=e.changedTouches[0].clientX;
document.getElementById('stage').ontouchend=e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>45) dx<0?go(current+1):go(current-1);
};
window.addEventListener('resize',()=>{build();go(current)});
build();go(0);
</script>
</body>
</html>
